; =============================================================================
; RMA System — configuration
; =============================================================================
; Edit this file on the PC where the app is installed, then restart the
; Windows service "RMASystem" (or reboot).
;
; Location when installed:
;   C:\Program Files\RMA System\config.ini
;
; SQL instance for this deployment: SQLEXPRESS01
;   localhost\SQLEXPRESS01
;   .\SQLEXPRESS01
;   YOUR-PC-NAME\SQLEXPRESS01
; =============================================================================

[Database]
Server=localhost\SQLEXPRESS01
Database=RMASystem
; Do not run EF schema migrations at startup (existing DB already has tables).
AutoMigrate=false

[Paths]
; Leave blank to use the install folder automatically
DataRoot=
; SQL .bak folder for backup-database.ps1 (default C:\sqlbackups if blank).
; SQL Server service account must have Modify on this folder.
BackupDir=C:\sqlbackups
