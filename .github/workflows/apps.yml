# Builds the TrackMyRMA apps. Runs when you push a tag like app-v1.0.0, or by hand:
# GitHub → Actions → "Build apps" → Run workflow. The files appear under the run's "Artifacts".
# (The website itself is built and deployed by Cloudflare, not here.)
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Build APK (installable, debug-signed)
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk TrackMyRMA-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: TrackMyRMA-android, path: apps/mobile/TrackMyRMA-android.apk }

  ios:
    name: iPhone (compile check)
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the iPhone simulator (no signing needed)
        working-directory: apps/mobile/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: TrackMyRMA-windows, path: apps/desktop/release/*.exe }

  mac:
    name: Mac app
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --mac --universal --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: TrackMyRMA-mac, path: apps/desktop/release/*.dmg }
